spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username : ${DB_USERNAME}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password:
      database: 0

  cache:
    type: redis

management:
  server:
    port: 9001
  endpoints:
    web:
      exposure:
        include: health
      base-path: /internal/user-service/actuator
  endpoint:
    health:
      group:
        readiness:
          include:
            - db
            - redis
        liveness:
          include:
            - ping